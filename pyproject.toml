[project]
name = "game-board-pipeline"
version = "0.1.0"
description = "게임 게시판 주제 분석 파이프라인 — 임베딩·클러스터링·요약·알림판단 + 실시간 확산 탐지"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "pandas",
    "pydantic-settings",
    "mlx-lm>=0.31.3",
    # transformers 5.13.0은 mlx-lm 0.31.x의 토크나이저 등록과 충돌
    # (AttributeError: 'str' object has no attribute '__module__')
    "transformers<5.13",
]

# 아직 준비되지 않은 모델용 슬롯 의존성.
# 임베딩 모델(EmbeddingGemma 등)이 준비되면:  uv sync --extra ml
[project.optional-dependencies]
ml = [
    "sentence-transformers",
    "scikit-learn>=1.3",
]

[tool.uv]
package = false
